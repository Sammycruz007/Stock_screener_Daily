name: Eagle Logic — Daily Scan

on:
  schedule:
    # 5AM UTC = 6AM WAT (GMT+1) — Monday to Friday only
    - cron: '0 5 * * 1-5'
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  run_pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 600

    steps:
      # ── 1. Checkout repo ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python 3.11 ─────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements-cloud.txt"

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-cloud.txt

      # ── 4. Run daily pipeline ─────────────────────────────────────────────
      - name: Run Eagle Logic pipeline
        run: python run_pipeline_cloud.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      # ── 5. Retrain ML models every Monday ─────────────────────────────────
      - name: Retrain ML models (Mondays only)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date +%u)" = "1" ]; then
            python ml/train_models.py
          else
            echo "Not Monday — skipping retrain"
          fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      # ── 6. Commit updated models back to repo ─────────────────────────────
      - name: Commit updated models
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          git config user.name  "Eagle Logic Bot"
          git config user.email "bot@eaglelogic.com"
          if compgen -G "models/*.pkl" > /dev/null; then
            git add models/*.pkl
            git diff --staged --quiet || git commit -m "chore: retrain models $(date +%Y-%m-%d)"
            git push
          else
            echo "No .pkl models found — skipping commit (training didn't produce models this run, e.g. not enough price history yet, or not Monday)"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN}}

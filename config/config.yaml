database:
  path: data/scanner.db

fetcher:
  batch_size: 25       # was 50 — smaller batches hit Yahoo less aggressively
  max_workers: 7     # 7 Parallel connections per batch
  retry_attempts: 3
  retry_delay_seconds: 5 # was 8 — more time between retries
  historical_days: 5920 # # 8 years (2018 to now)
  incremental_days: 5
  
filters:
  min_avg_volume: 500000
  min_price: 10.0

linreg:
  period: 250
  std_devs:
  - 1
  - 2
  - 3

logging:
  backup_count: 5
  level: INFO
  log_dir: logs
  max_file_size_mb: 10

ml:
  high_probability_threshold: 0.7
  label_forward_periods: 60 # 3 Months. 
  min_training_samples: 50
  model_retrain_days: 15 # Retrain the model every 15 days (2 weeks)
  backfill_stride: 1

scanner:
  long_entry_sd_max: -3
  long_entry_sd_min: -1
  short_entry_sd_max: 3
  short_entry_sd_min: 1

scheduler:
  run_time: "06:00"
  timezone: "Africa/Lagos"    # GMT+1, no DST

sentiment:
  put_call_bearish_threshold: 1.2
  put_call_bullish_threshold: 0.7
  short_interest_high_threshold: 15.0

smc:
  choch_confirmation: close
  min_pivot_candles: 10 # 2 weeks of market data
universe:
  indices:
  - SPY
  - QQQ
  - DIA
  sectors:
  - XLK
  - XLF
  - XLE
  - XLV
  - XLI
  - XLY
  - XLP
  - XLU
  - XLB
  - XLRE
  - XLC
volume:
  avg_volume_period: 20
  lookback_days: 20

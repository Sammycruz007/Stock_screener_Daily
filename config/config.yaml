database:
  path: data/scanner.db

fetcher:
  batch_size: 25       # was 50 — smaller batches hit Yahoo less aggressively
  max_workers: 7     # 7 Parallel connections per batch
  retry_attempts: 3
  retry_delay_seconds: 5 # was 8 — more time between retries
  historical_days: 1800  #  5 years — daily candles have no ~60-day cap like intraday did
  incremental_days: 10   # buffer for long weekends/holiday closures on daily bars
  
filters:
  min_avg_volume: 1000000
  min_price: 15.0

linreg:
  period: 250
  std_devs:
  - 1
  - 2
  - 3

logging:
  backup_count: 5
  level: INFO
  log_dir: logs
  max_file_size_mb: 10

ml:
  high_probability_threshold: 0.7
  label_forward_periods: 60 # 60 daily candles ≈ 3 months forward
  min_training_samples: 50
  model_retrain_days: 7
  backfill_stride: 3

scanner:
  long_entry_sd_max: -3
  long_entry_sd_min: -1
  short_entry_sd_max: 3
  short_entry_sd_min: 1

scheduler:
  run_time: "06:00"
  timezone: "Africa/Lagos"    # GMT+1, no DST

sentiment:
  put_call_bearish_threshold: 1.2
  put_call_bullish_threshold: 0.7
  short_interest_high_threshold: 15.0

smc:
  choch_confirmation: close
  min_pivot_candles: 30 # 30 daily candles ≈ 6 weeks — SMC's min_required (×3) = 90 daily candles ≈ 4.3 months, safely below LinReg's 250-day requirement
universe:
  indices:
  - SPY
  - QQQ
  - DIA
  sectors:
  - XLK
  - XLF
  - XLE
  - XLV
  - XLI
  - XLY
  - XLP
  - XLU
  - XLB
  - XLRE
  - XLC
volume:
  avg_volume_period: 20
  lookback_days: 26

adx:
  period: 14   # standard for daily bars, matches existing ATR14 convention

relative_strength:
  benchmark: SPY
  lookback_period: 63   # ~1 trading quarter

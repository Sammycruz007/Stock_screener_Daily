database:
  path: /app/data/scanner.db
fetcher:
  batch_size: 50
  historical_days: 365
  incremental_days: 5
  max_workers: 10
  retry_attempts: 3
  retry_delay_seconds: 5
filters:
  min_avg_volume: 500000
  min_price: 10.0
linreg:
  period: 200
  std_devs:
  - 1
  - 2
  - 3
logging:
  backup_count: 5
  level: INFO
  log_dir: logs
  max_file_size_mb: 10
ml:
  high_probability_threshold: 0.7
  label_forward_days: 15
  min_training_samples: 500
  model_retrain_days: 7
scanner:
  long_entry_sd_max: -3
  long_entry_sd_min: -1
  short_entry_sd_max: 3
  short_entry_sd_min: 1
scheduler:
  run_time: '16:30'
  timezone: America/New_York
sentiment:
  put_call_bearish_threshold: 1.2
  put_call_bullish_threshold: 0.7
  short_interest_high_threshold: 15.0
smc:
  choch_confirmation: close
  min_pivot_candles: 5
universe:
  indices:
  - SPY
  - QQQ
  - DIA
  sectors:
  - XLK
  - XLF
  - XLE
  - XLV
  - XLI
  - XLY
  - XLP
  - XLU
  - XLB
  - XLRE
  - XLC
volume:
  avg_volume_period: 20
  lookback_days: 10

name: Eagle Logic — Daily Scan

on:
  schedule:
    # 00:00, 12:00, 20:00 UTC — Monday to Friday only (FX trades
    # continuously Sun evening through Fri evening; skips Sat/Sun
    # since no new 4H candles form during the weekend close).
    # One cron line covers all 3 times since they share the same
    # day-of-week pattern — '0 0,12,20' means "at minute 0 of hours
    # 0, 12, and 20" every matching day.
    # 00:00 UTC — Asian/Tokyo session open
    # 12:00 UTC — London session in full swing, pre-NY open
    # 20:00 UTC — NY session close, next 4H candle forming into Asia
    - cron: '0 0,12,20 * * 1,2,3,4,5'
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  run_pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 600

    steps:
      # ── 1. Checkout repo ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python 3.11 ─────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements-cloud.txt"

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-cloud.txt

      # ── 4. Run daily pipeline ─────────────────────────────────────────────
      - name: Run Eagle Logic pipeline
        run: python run_pipeline_cloud.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      # ── 5. Retrain ML models once a month ──────────────────────────────────
      - name: Retrain ML models (monthly)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date +%d)" -le "03" ]; then
            python ml/train_models.py
          else
            echo "Not within the first 3 days of the month — skipping retrain"
          fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      # ── 6. Commit updated models back to repo ─────────────────────────────
      - name: Commit updated models
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          git config user.name  "Eagle Logic Bot"
          git config user.email "bot@eaglelogic.com"
          if compgen -G "models/*.pkl" > /dev/null; then
            git add models/*.pkl
            git diff --staged --quiet || git commit -m "chore: retrain models $(date +%Y-%m-%d)"
            git push
          else
            echo "No .pkl models found — skipping commit (training didn't produce models this run, e.g. not enough price history yet, or not Monday)"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN}}
